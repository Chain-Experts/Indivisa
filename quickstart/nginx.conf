# The page, the seat files, and a proxy to each participant's JSON Ledger
# API. This network has no authentication, so there is no token to inject;
# the public deployment for the judges adds one here (see
# infra/devnet/nginx.conf.example).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names a content-hashed bundle, so a cached copy of it pins
    # the browser to an old build: rebuild the image, reload, and the page is
    # still the previous one. The assets may be cached forever - their names
    # change - but the file that points at them must not be.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Written by the seed container into the shared volume.
    location /demo/ {
        alias /demo/;
        add_header Cache-Control "no-store" always;
        types { application/json json; }
        default_type application/json;
    }

    # The ledger wants a token; the browser never sees one. The proxy adds
    # it for every /api/ route, the same shape as the DevNet deployment in
    # infra/devnet/nginx.conf.example. It is an unsafe demo token on a local
    # network that holds nothing, and quickstart/canton.conf accepts it.
    proxy_set_header Authorization "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJwYXJ0aWNpcGFudF9hZG1pbiIsImF1ZCI6Imh0dHBzOi8vY2FudG9uLm5ldHdvcmsuZ2xvYmFsIiwiZXhwIjo0MDcwOTA4ODAwfQ.WOS0ZzNrmPtZZaPJXHF8VpF6HKs2r26F_JTG1CUGg08";

    # The approver nodes exist only under the `govern` compose profile, so this
    # upstream is resolved per request through Docker's embedded DNS rather
    # than at startup: a literal hostname here would stop nginx booting on the
    # ungoverned stack, which is the path every judge takes first. A missing
    # node then costs one 502, not the whole page.
    #
    # No Authorization either. The server-level header below is Canton's, and
    # these nodes are not Canton; they run with DECPM_INSECURE on a local
    # network and mint their own.
    # Reads and the execute go to node 1: the vote, the committee and the
    # settlement are the same facts whichever member you ask.
    #
    # Confirming is not. A confirmation is signed by ONE member, on that
    # member's own node, so the approvers desk needs a route per node. Longest
    # prefix wins in nginx, so /decman/2/... reaches node 2 and anything else
    # under /decman/ still reaches node 1.
    #
    # The resolver and the `set` are what let this file load when the govern
    # profile is down: nginx resolves the name per request rather than at
    # startup, so the ungoverned stack boots with no approver present.
    location /decman/1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $decman1 "http://decman-1:8081";
        rewrite ^/decman/1/(.*)$ /$1 break;
        proxy_pass $decman1;
        proxy_set_header Authorization "";
    }
    location /decman/2/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $decman2 "http://decman-2:8082";
        rewrite ^/decman/2/(.*)$ /$1 break;
        proxy_pass $decman2;
        proxy_set_header Authorization "";
    }
    location /decman/3/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $decman3 "http://decman-3:8083";
        rewrite ^/decman/3/(.*)$ /$1 break;
        proxy_pass $decman3;
        proxy_set_header Authorization "";
    }
    location /decman/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $decman "http://decman-1:8081";
        rewrite ^/decman/(.*)$ /$1 break;
        proxy_pass $decman;
        proxy_set_header Authorization "";
    }

    location /api/registry/ { proxy_pass http://canton:5013/; }
    location /api/agent/    { proxy_pass http://canton:5023/; }
    location /api/alice/    { proxy_pass http://canton:5033/; }
    location /api/bob/      { proxy_pass http://canton:5043/; }
    location /api/charlie/  { proxy_pass http://canton:5053/; }
}

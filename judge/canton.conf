// Indivisa, in one container: one synchronizer, five participants, in memory.
// Generated from infra/localnet/localnet.conf; the only differences are that
// every API binds to 0.0.0.0 so the other containers can reach it, and the
// comments about running it from PowerShell are gone.
//
// Originally: one synchronizer, five participants, one JVM, in memory.
//
// Topology mirrors the demo and DevNet: the cash registry, the paying agent and
// each holder on its OWN participant, so that a holder's participant never
// receives another holder's data. That is the privacy claim proof 2 rests on
// and a single-participant setup cannot show it.
//
// Storage is in-memory: restart and the ledger is empty. That is what we want
// for proofs and benchmarks. For a demo that must survive a restart, switch
// storage.type to postgres (see the Canton docs) or run the Splice validator
// image; nothing above this file changes.
//
// Ports: sequencer 5001/5002, mediator 5202, participants 50X1 ledger API,
// 50X2 admin API, 50X3 JSON Ledger API, X = 1 registry, 2 agent, 3 alice,
// 4 bob, 5 charlie.

canton {
  features {
    enable-preview-commands = yes
    enable-testing-commands = yes
  }
  parameters {
    manual-start = no
    non-standard-config = yes
  }

  sequencers {
    sequencer1 {
      storage.type = memory
      public-api { port = 5001, address = "0.0.0.0" }
      admin-api { port = 5002, address = "0.0.0.0" }
      sequencer.type = BFT
    }
  }

  mediators {
    mediator1 {
      storage.type = memory
      admin-api { port = 5202, address = "0.0.0.0" }
    }
  }

  participants {
    registry {
      storage.type = memory
      ledger-api { port = 5011, address = "0.0.0.0" }
      admin-api { port = 5012, address = "0.0.0.0" }
      http-ledger-api { port = 5013, address = "0.0.0.0" }
    }
    agent {
      storage.type = memory
      ledger-api { port = 5021, address = "0.0.0.0" }
      admin-api { port = 5022, address = "0.0.0.0" }
      http-ledger-api { port = 5023, address = "0.0.0.0" }
    }
    alice {
      storage.type = memory
      ledger-api { port = 5031, address = "0.0.0.0" }
      admin-api { port = 5032, address = "0.0.0.0" }
      http-ledger-api { port = 5033, address = "0.0.0.0" }
    }
    bob {
      storage.type = memory
      ledger-api { port = 5041, address = "0.0.0.0" }
      admin-api { port = 5042, address = "0.0.0.0" }
      http-ledger-api { port = 5043, address = "0.0.0.0" }
    }
    charlie {
      storage.type = memory
      ledger-api { port = 5051, address = "0.0.0.0" }
      admin-api { port = 5052, address = "0.0.0.0" }
      http-ledger-api { port = 5053, address = "0.0.0.0" }
    }
  }
}

# 3.4.11 to match every other package in the Decentralization Manager repo,
# not the 3.5.10 we build with. Their SDK does support this module's LF
# target: governance-action-v1 is itself built at 3.4.11 with --target=2.2.
sdk-version: 3.4.11
name: governance-settlement-v0
version: 0.1.0
source: daml
# A governed action for Token Standard V2 batch settlement, for BitSafe's
# Decentralization Manager. Depends on their interface package and the
# Splice V2 API only; nothing from Indivisa, so it can be adopted on its own.
# LF 2.2 because governance-action-v1 is; the Splice V2 DARs are 2.1.
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../dars/governance-action-v1-0.1.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-v2-1.0.0.dar
build-options:
  - --target=2.2

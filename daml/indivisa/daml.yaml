sdk-version: 3.5.10
name: indivisa
source: .
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
# Token Standard V2 (CIP-0112), as released. Prebuilt DARs copied verbatim from
# canton-network/splice tag 0.8.1, path daml/dars/. Sizes verified 17 Sep 2026.
# These are data-dependencies: we consume the interfaces, we do not build them.
# The model depends only on the API packages and the shared utils, never on a
# concrete token; the test package brings the reference token.
data-dependencies:
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../dars/splice-token-standard-utils-2.0.0.dar
# The V2 packages target LF 2.1 and bundle a 2.1 daml-stdlib. We match them:
# a 2.3 build drags in a second stdlib and damlc refuses the package database.
build-options:
  - --target=2.1

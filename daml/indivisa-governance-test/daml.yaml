sdk-version: 3.5.10
name: indivisa-governance-test
source: .
version: 0.1.0
# The governance proofs: with one confirmation of three the settle does not
# execute, with two it does and every holder is paid. Runs against BitSafe's
# governance-core on the IDE ledger. Reuses the cash and agent fixtures of
# indivisa-test; never uploaded. LF 2.2 because the governance DARs are.
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../indivisa/.daml/dist/indivisa-0.4.0.dar
  - ../indivisa-test/.daml/dist/indivisa-test-0.1.0.dar
  - ../indivisa-governance/.daml/dist/indivisa-governance-v0-0.1.0.dar
  - ../governance-settlement/.daml/dist/governance-settlement-v0-0.1.0.dar
  - ../dars/governance-action-v1-0.1.0.dar
  - ../dars/governance-core-v1-0.1.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v2-1.0.0.dar
  - ../dars/splice-token-standard-utils-2.0.0.dar
  - ../dars/splice-test-token-v2-1.0.1.dar
build-options:
  - --target=2.2
  - -Wno-deprecated-exceptions

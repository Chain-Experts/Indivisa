sdk-version: 3.5.10
name: governance-settlement-test
version: 0.1.0
source: daml
# Tests for governance-settlement-v0, deliberately self-contained: the only
# packages below are BitSafe's governance layer and the Splice Token Standard.
# Nothing from Indivisa, so this package can be lifted into the
# Decentralization Manager repository exactly as it stands - which is the
# point, since a module offered as application-neutral whose tests are not
# would be making a claim it could not keep.
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../governance-settlement/.daml/dist/governance-settlement-v0-0.1.0.dar
  - ../dars/governance-action-v1-0.1.0.dar
  - ../dars/governance-core-v1-0.1.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v2-1.0.0.dar
  - ../dars/splice-token-standard-utils-2.0.0.dar
  - ../dars/splice-test-token-v2-1.0.1.dar
build-options:
  - --target=2.2
  - -Wno-deprecated-exceptions

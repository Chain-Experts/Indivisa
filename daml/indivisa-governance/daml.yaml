sdk-version: 3.5.10
name: indivisa-governance-v0
version: 0.1.0
source: daml
# Indivisa's coupon run as a governed action for BitSafe's Decentralization
# Manager: the paying agent proposes Run_Settle, the approvers confirm. A
# separate package so that the indivisa model carries no governance
# dependency; LF 2.2 because governance-action-v1 is.
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../dars/governance-action-v1-0.1.0.dar
  - ../indivisa/.daml/dist/indivisa-0.6.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../dars/splice-token-standard-utils-2.0.0.dar
build-options:
  - --target=2.2

sdk-version: 3.5.10
name: indivisa-test
source: .
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
# Scripts live in their own package so that uploading indivisa.dar to a
# participant does not drag daml-script along with it.
#
# splice-test-token-v2 is the CIP's reference cash token. It is a test fixture
# here: the model never depends on it, only the proofs do.
data-dependencies:
  - ../indivisa/.daml/dist/indivisa-0.1.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../dars/splice-token-standard-utils-2.0.0.dar
  - ../dars/splice-test-token-v2-1.0.1.dar
build-options:
  - --target=2.1
  # errorText reads the message out of a failed submission so proof 4 records
  # the rejection verbatim. That needs the deprecated exception API; there is
  # no other way to read a `fail` message from trySubmit. Test code only.
  - -Wno-deprecated-exceptions
